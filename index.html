<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LibraCore | Library Management</title>
<style>
:root{--nav:#102a43;--primary:#1769e0;--bg:#f4f7fb;--card:#fff;--text:#182235;--muted:#718096;--border:#dce5ef;--danger:#d64545;--success:#16845b;--warning:#a76a00}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.top{background:var(--nav);color:#fff;padding:14px 4%;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-size:21px;font-weight:800}.userbar{display:flex;gap:10px;align-items:center}.role{font-size:12px;padding:6px 10px;border-radius:99px;background:#214b6d}.wrap{width:min(1180px,94%);margin:24px auto}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700}.primary{background:var(--primary);color:#fff}.dark{background:var(--nav);color:#fff}.light{background:#fff;color:var(--text);border:1px solid var(--border)}.danger{background:var(--danger);color:#fff}.success{background:var(--success);color:#fff}.warning{background:#f3c969;color:#4b3300}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 8px 24px #102a4310}.stat{font-size:28px;font-weight:800;margin-top:4px}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.toolbar input{max-width:440px}.input,textarea,select{width:100%;padding:11px 12px;border:1px solid #cbd7e4;border-radius:10px;background:#fff;outline:none}.input:focus,textarea:focus,select:focus{border-color:var(--primary)}.bookgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.book h3{margin:7px 0}.badge{display:inline-block;background:#eaf3ff;color:var(--primary);padding:5px 8px;border-radius:99px;font-size:11px;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf1f5;font-size:13px;white-space:nowrap}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form{display:grid;gap:12px}.form label{font-size:13px;font-weight:700}.form label span{display:block;margin-bottom:5px}.modal{position:fixed;inset:0;background:#0b1d2f99;display:grid;place-items:center;padding:18px;z-index:20}.modalbox{background:#fff;width:min(650px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#102a43,#1769e0)}.authbox{width:min(440px,100%);background:#fff;border-radius:20px;padding:28px;box-shadow:0 25px 70px #0005}.authbox h1{margin:0}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button.active{background:var(--nav);color:#fff}.message{padding:10px;border-radius:9px;background:#fff4cc;color:#674f00;font-size:13px}.message.error{background:#ffe6e6;color:#8b2222}.chart{height:240px;display:flex;align-items:end;gap:10px;border-bottom:1px solid var(--border);padding:25px 8px 0}.bar{flex:1;min-width:22px;background:var(--primary);border-radius:7px 7px 0 0;position:relative}.bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.bookgrid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid,.bookgrid,.formgrid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.userbar{width:100%;justify-content:space-between}.toolbar input{max-width:none}.wrap{margin-top:16px}}
</style>
</head>
<body>
<div id="auth" class="auth"><div class="authbox"><h1>📚 LibraCore</h1><p class="muted">Real Library Management System</p><div class="tabs"><button id="loginTab" class="btn light active">Login</button><button id="registerTab" class="btn light">Student registration</button></div><div id="authMsg" class="message hidden"></div><form id="loginForm" class="form"><label><span>Email</span><input id="loginEmail" class="input" type="email" required></label><label><span>Password</span><input id="loginPassword" class="input" type="password" required></label><button class="btn primary">Login</button></form><form id="registerForm" class="form hidden"><label><span>Full name</span><input id="regName" class="input" required minlength="2"></label><label><span>Email</span><input id="regEmail" class="input" type="email" required></label><label><span>Password</span><input id="regPassword" class="input" type="password" required minlength="8"></label><button class="btn primary">Create student account</button></form><p class="muted">Faculty accounts are created by the system administrator, not through public registration.</p></div></div>
<div id="app" class="hidden"><header class="top"><div class="brand">📚 LibraCore</div><div class="userbar"><span id="userRole" class="role"></span><span id="userName"></span><button id="logout" class="btn light">Logout</button></div></header><main class="wrap"><nav class="nav"><button data-tab="catalog" class="btn light active">Book catalogue</button><button id="loansNav" data-tab="loans" class="btn light">My loans</button><button id="facultyNav" data-tab="faculty" class="btn light hidden">Faculty dashboard</button><button id="auditNav" data-tab="audit" class="btn light hidden">Audit log</button></nav>
<section id="catalogTab"><div class="toolbar"><input id="search" class="input" placeholder="Search title, author, ISBN or category"><button id="addBook" class="btn primary hidden">+ Add book</button></div><div id="books" class="bookgrid"></div></section>
<section id="loansTab" class="hidden"><div id="studentStats" class="grid"></div><div class="card" style="margin-top:14px"><h2>My borrowing history</h2><div id="loans" class="tablewrap"></div></div></section>
<section id="facultyTab" class="hidden"><div id="facultyStats" class="grid"></div><div class="card" style="margin-top:14px"><h2>Most issued books</h2><div id="popular" class="tablewrap"></div></div><div class="card" style="margin-top:14px"><h2>Category inventory</h2><div id="categoryChart" class="chart"></div></div><div class="card" style="margin-top:14px"><h2>Monthly issues</h2><div id="monthlyChart" class="chart"></div></div></section>
<section id="auditTab" class="hidden"><div class="card"><h2>Recent system activity</h2><div id="audit" class="tablewrap"></div></div></section>
</main></div>
<div id="bookModal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Add book</h2><button id="closeModal" class="btn light">✕</button></div><form id="bookForm" class="form"><div class="formgrid"><label><span>Title *</span><input id="bTitle" class="input" required></label><label><span>Author *</span><input id="bAuthor" class="input" required></label><label><span>ISBN</span><input id="bIsbn" class="input"></label><label><span>Publisher</span><input id="bPublisher" class="input"></label><label><span>Category</span><input id="bCategory" class="input" value="General"></label><label><span>Publication year</span><input id="bYear" class="input" type="number" min="1000" max="2100"></label><label><span>Total copies *</span><input id="bCopies" class="input" type="number" min="1" value="1" required></label></div><label><span>Description</span><textarea id="bDescription" rows="4"></textarea></label><div class="actions"><button type="submit" class="btn primary">Save book</button><button type="button" id="cancelModal" class="btn light">Cancel</button></div></form></div></div>
<script>
const API=(localStorage.getItem('library_api')||'http://localhost:5000/api').replace(/\/$/,''), $=id=>document.getElementById(id);let token=localStorage.getItem('library_token'),me=JSON.parse(localStorage.getItem('library_user')||'null');
function headers(){return {'Content-Type':'application/json',Authorization:'Bearer '+token}}
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{...headers(),...(opt.headers||{})}});const d=await r.json().catch(()=>({message:'Invalid server response'}));if(!r.ok)throw Error(d.message||'Request failed');return d}
function msg(text,error=false){$('authMsg').textContent=text;$('authMsg').classList.toggle('hidden',!text);$('authMsg').classList.toggle('error',error)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return '₹'+Number(n||0).toFixed(2)}
function switchAuth(register){$('loginForm').classList.toggle('hidden',register);$('registerForm').classList.toggle('hidden',!register);$('loginTab').classList.toggle('active',!register);$('registerTab').classList.toggle('active',register);msg('')}
$('loginTab').onclick=()=>switchAuth(false);$('registerTab').onclick=()=>switchAuth(true);
$('loginForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({email:$('loginEmail').value,password:$('loginPassword').value})});token=d.token;me=d.user;localStorage.setItem('library_token',token);localStorage.setItem('library_user',JSON.stringify(me));init()}catch(e){msg(e.message,true)}};
$('registerForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/auth/register',{method:'POST',body:JSON.stringify({fullName:$('regName').value,email:$('regEmail').value,password:$('regPassword').value})});switchAuth(false);$('loginEmail').value=$('regEmail').value;msg(d.message)}catch(e){msg(e.message,true)}};
function logout(){localStorage.removeItem('library_token');localStorage.removeItem('library_user');location.reload()};$('logout').onclick=logout;
function showTab(tab){['catalog','loans','faculty','audit'].forEach(x=>$(x+'Tab').classList.toggle('hidden',x!==tab));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='catalog')loadBooks();if(tab==='loans')loadLoans();if(tab==='faculty')loadAnalytics();if(tab==='audit')loadAudit()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
async function loadBooks(){try{const q=encodeURIComponent($('search').value.trim());const rows=await api('/books?q='+q);$('books').innerHTML=rows.length?rows.map(b=>`<article class="card"><span class="badge">${esc(b.category)}</span><h3>${esc(b.title)}</h3><p class="muted">${esc(b.author)}${b.publisher?' · '+esc(b.publisher):''}</p><p class="muted">ISBN: ${esc(b.isbn||'Not provided')} · ${b.available_copies}/${b.total_copies} available</p>${b.description?`<p>${esc(b.description)}</p>`:''}<div class="actions">${me.role==='STUDENT'?`<button class="btn primary" onclick="issueBook(${b.id})" ${b.available_copies<1?'disabled':''}>Issue</button>`:''}${me.role==='FACULTY'?`<button class="btn light" onclick="editStock(${b.id},${b.total_copies})">Update copies</button><button class="btn danger" onclick="removeBook(${b.id})">Remove</button>`:''}</div></article>`).join(''):'<div class="card empty">No books match your search.</div>'}catch(e){alert(e.message)}}
$('search').oninput=loadBooks;
async function issueBook(id){try{const d=await api('/loans',{method:'POST',body:JSON.stringify({bookId:id})});alert(d.message+`\nDue in ${d.dueInDays} days.`);loadBooks()}catch(e){alert(e.message)}}
async function removeBook(id){if(!confirm('Remove this title from the active catalogue?'))return;try{alert((await api('/books/'+id,{method:'DELETE'})).message);loadBooks()}catch(e){alert(e.message)}}
async function editStock(id,current){const n=prompt('New total number of copies:',current);if(n===null)return;try{alert((await api('/books/'+id,{method:'PUT',body:JSON.stringify({totalCopies:Number(n)})})).message);loadBooks()}catch(e){alert(e.message)}}
async function loadLoans(){try{const [rows,s]=await Promise.all([api('/loans/my'),api('/analytics/student')]);$('studentStats').innerHTML=stat('Total loans',s.totalLoans)+stat('Active',s.activeLoans)+stat('Overdue',s.overdue)+stat('Total penalty',money(s.totalPenalty));$('loans').innerHTML=rows.length?`<table><tr><th>Book</th><th>Issued</th><th>Due</th><th>Status</th><th>Penalty</th><th>Action</th></tr>${rows.map(l=>`<tr><td>${esc(l.title)}</td><td>${fmt(l.issued_at)}</td><td>${fmt(l.due_at)}</td><td>${l.status}${l.status==='ISSUED'&&new Date(l.due_at)<new Date()?'<br><small style="color:#d64545">Overdue</small>':''}</td><td>${money(l.penalty)}</td><td>${l.status==='ISSUED'?`<button class="btn success" onclick="returnBook(${l.id})">Return</button>`:'—'}</td></tr>`).join('')}</table>`:'<div class="empty">You have no borrowing history.</div>'}catch(e){alert(e.message)}}
async function returnBook(id){try{const d=await api('/loans/'+id+'/return',{method:'POST'});alert(`Returned successfully.\nDays late: ${d.daysLate}\nPenalty: ${money(d.penalty)}`);loadLoans();loadBooks()}catch(e){alert(e.message)}}
function stat(label,value){return `<div class="card"><div class="muted">${label}</div><div class="stat">${value}</div></div>`}function fmt(v){return v?new Date(v.replace(' ','T')+'Z').toLocaleDateString():''}
async function loadAnalytics(){try{const d=await api('/analytics');$('facultyStats').innerHTML=stat('Book titles',d.books.totalTitles)+stat('Total copies',d.books.totalCopies)+stat('Issued now',d.books.issuedCopies)+stat('Penalties',money(d.loans.penalties));$('popular').innerHTML=`<table><tr><th>Title</th><th>Author</th><th>Issues</th></tr>${d.popular.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.author)}</td><td>${x.issueCount}</td></tr>`).join('')}</table>`;drawBars('categoryChart',d.categories.map(x=>[x.category,x.copies]));drawBars('monthlyChart',d.monthly.map(x=>[x.month,x.issues]))}catch(e){alert(e.message)}}
function drawBars(id,data){const max=Math.max(1,...data.map(x=>Number(x[1])));$(id).innerHTML=data.length?data.map(x=>`<div class="bar" style="height:${Math.max(8,Number(x[1])/max*100)}%"><span>${esc(x[0])}: ${x[1]}</span></div>`).join(''):'<div class="empty">No data yet.</div>'}
async function loadAudit(){try{const rows=await api('/admin/audit');$('audit').innerHTML=`<table><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>Details</th></tr>${rows.map(x=>`<tr><td>${fmt(x.created_at)}</td><td>${esc(x.full_name||'System')}</td><td>${esc(x.action)}</td><td>${esc(x.entity_type)} #${x.entity_id||'—'}</td><td>${esc(x.details||'')}</td></tr>`).join('')}</table>`}catch(e){alert(e.message)}}
function openModal(){ $('bookModal').classList.remove('hidden');$('bookForm').reset();$('bCategory').value='General';$('modalTitle').textContent='Add book'}function closeModal(){$('bookModal').classList.add('hidden')}$('addBook').onclick=openModal;$('closeModal').onclick=closeModal;$('cancelModal').onclick=closeModal;
$('bookForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/books',{method:'POST',body:JSON.stringify({title:$('bTitle').value,author:$('bAuthor').value,isbn:$('bIsbn').value,publisher:$('bPublisher').value,category:$('bCategory').value,publicationYear:$('bYear').value?Number($('bYear').value):null,totalCopies:Number($('bCopies').value),description:$('bDescription').value})});alert(d.message);closeModal();loadBooks()}catch(e){alert(e.message)}};
function init(){if(!token||!me)return;document.title='LibraCore | '+me.role;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('userName').textContent=me.name;$('userRole').textContent=me.role;if(me.role==='FACULTY'){$('loansNav').classList.add('hidden');$('facultyNav').classList.remove('hidden');$('auditNav').classList.remove('hidden');$('addBook').classList.remove('hidden')}loadBooks()}init();
</script></body></html>
